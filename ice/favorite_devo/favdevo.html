<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Favorite Devotionals</title>
  <link rel="stylesheet" href="styles/styles.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-image">
        <h1>My Favorite<br>Devotionals</h1>
      </div>
    </header>
    <main>
      <div class="content-box">
        <!-- Add your devotional content here -->
        <table>
          <tr>
            <th>Speaker</th>
            <th>Title</th>
            <th>Location</th>
            <th>Year</th>
          </tr>
          <tr>
            <td>John Doe</td>
            <td>Morning Devotional</td>
            <td>New York</td>
            <td>2023</td>
          </tr>
          <tr>
            <td>Jane Smith</td>
            <td>Evening Devotional</td>
            <td>Los Angeles</td>
            <td>2024</td>
          </tr>
          <tr>
            <td>Michael Johnson</td>
            <td>Night Devotional</td>
            <td>Chicago</td>
            <td>2022</td>
          </tr>
        </table>
        <p>Add a new favorite devotional!:</p>
        <form>
          <label for="speaker">Speaker:</label>
          <input type="text" id="speaker" name="speaker" />
          <label for="title">Title:</label>
          <input type="text" id="title" name="title" />
          <label for="location">Location:</label>
          <input type="text" id="location" name="location" />
          <label for="year">Year:</label>
          <input type="text" id="year" name="year" />
        </form>
      </div>
    </main>
  </div>
</body>
</html>
