<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Favorite Devotionals</title>
  <link rel="stylesheet" href="styles/styles.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-image">
        <h1>My Favorite<br>Devotionals</h1>
      </div>
    </header>
    <main>
      <div class="content-box">
        <!-- Add your devotional content here -->
        <table>
          <tr>
            <th>Speaker</th>
            <th>Title</th>
            <th>Location</th>
            <th>Year</th>
          </tr>
          <tr>
            <td>Elder James O. Fantone</td>
            <td>The Battle is the Lord's</td>
            <td>BYUI</td>
            <td>2026</td>
          </tr>
          <tr>
            <td>Jeffrey Rosen</td>
            <td>The Pursuit of Happiness</td>
            <td>BYU</td>
            <td>2025</td>
          </tr>
          <tr>
            <td>Kalani Sitake</td>
            <td>Discovering God's Plan for You</td>
            <td>BYU</td>
            <td>2025</td>
          </tr>
        </table>
        <div id="devoform">
          <p>Add a new favorite devotional:</p>
          <form>
            <label for="speaker">Speaker:</label>
            <input type="text" id="speaker" name="speaker" />
            <label for="title">Title:</label>
            <input type="text" id="title" name="title" />
            <label for="location">Location:</label>
            <input type="text" id="location" name="location" />
            <label for="year">Year:</label>
            <input type="text" id="year" name="year" />
          </form>
          <button>submit</button>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
